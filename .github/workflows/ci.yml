name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The production guard must refuse a build with no real configuration.
      - name: Production build refuses missing config
        run: |
          if npm run build; then
            echo "::error::The production build should have failed without NEXT_PUBLIC_* variables"
            exit 1
          fi
      # CI has no real Supabase project or site address (and no secrets, no test:rls), so the
      # build uses the explicit flag instead. Never deploy a build made this way.
      - run: npm run build
        env:
          ALLOW_PLACEHOLDER_ENV: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the site with a fake Supabase address and intercepts the insert (see playwright.config.ts).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
